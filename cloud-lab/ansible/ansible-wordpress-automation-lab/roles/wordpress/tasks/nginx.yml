---
- name: Nginx - Determine PHP-FPM version
  ansible.builtin.shell: "dpkg -l | grep php-fpm | awk '{print $3}' | grep -o '[0-9]\\.[0-9]' | head -n 1"
  register: php_ver
  changed_when: false

- name: Nginx - Remove default site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent

- name: Nginx - Copy virtual host configuration
  ansible.builtin.template:
    src: nginx-vhost.j2
    dest: /etc/nginx/conf.d/wordpress.conf
    owner: root
    group: root
    mode: "0644"
  notify: Nginx - Restart

- name: Nginx - Start PHP-FPM
  ansible.builtin.service:
    name: "php{{ php_ver.stdout }}-fpm"
    state: started
    enabled: yes

- name: Nginx - Start Nginx
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: yes
