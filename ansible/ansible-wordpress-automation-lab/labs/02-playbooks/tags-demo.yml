---
- name: Tags demonstration - Web
  hosts: serveurweb
  become: yes

  tasks:
    - name: Install Apache2
      ansible.builtin.apt:
        name: apache2
        state: present
      tags:
        - web

    - name: Start Apache2
      ansible.builtin.service:
        name: apache2
        state: started
        enabled: yes
      tags:
        - web
        - always

    - name: Check Apache page
      ansible.builtin.command:
        cmd: curl -s localhost
      register: apache_result
      tags:
        - web
        - always

    - name: Show Apache result
      ansible.builtin.debug:
        var: apache_result.stdout
      tags:
        - web
        - always

- name: Tags demonstration - Database
  hosts: serveurdatabase
  become: yes

  tasks:
    - name: Install PostgreSQL
      ansible.builtin.apt:
        name: postgresql
        state: present
      tags:
        - db

    - name: Start PostgreSQL
      ansible.builtin.service:
        name: postgresql
        state: started
        enabled: yes
      tags:
        - db

    - name: Special task that only runs when explicitly requested
      ansible.builtin.debug:
        msg: "This task uses the never tag"
      tags:
        - never
        - db_special
